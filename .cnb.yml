# prompt-vault 云原生构建（CNB）流水线
#
# ┌─ 读这份配置前先记住一条铁律 ─────────────────────────────────────────────┐
# │ 前端必须在 Rust 之前构建。                                               │
# │ 原因：前端产物是用 rust-embed 在**编译期**嵌进二进制的，顺序反了不会报错 │
# │ （build.rs 会写一个占位页兜底），只会静默产出一个「打开是占位页」的二进制。│
# │ 所以下面每个流水线的 stage 顺序都是「前端 → Rust → 测试 → 冒烟」。       │
# └──────────────────────────────────────────────────────────────────────────┘

# ---------------------------------------------------------------- 主分支 / PR
main:
  push:
    - name: 构建与测试（Linux + Windows 交叉编译）
      runner:
        # CNB 官方 amd64 节点；本项目不需要 GPU（不跑模型）
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        # 用 ci/Dockerfile 现建环境镜像（Node 22 + Rust 1.99 + mingw-w64）
        build:
          dockerfile: ci/Dockerfile
          by:
            - ci/Dockerfile
          versionBy:
            - ci/Dockerfile
        # 缓存：cargo 依赖与编译产物、pnpm store。均走默认的 copy-on-write，可并发构建。
        # 注意：卷路径之间不能有包含关系，所以 registry 与 git 分开声明。
        # 另外 volumes 是 docker 的子字段（不是 pipeline 级字段），放错层级 schema 会直接拒绝。
        volumes:
          - /usr/local/cargo/registry
          - /usr/local/cargo/git
          - ./target
          - /root/.local/share/pnpm/store
      stages:
        - name: 环境自检
          script: |
            set -eu
            echo "工作目录: $(pwd)"
            node --version
            pnpm --version
            rustc --version
            cargo --version
            x86_64-w64-mingw32-gcc --version | head -1

        - name: 前端构建
          script: |
            set -eu
            cd web
            pnpm install --frozen-lockfile
            pnpm build
            test -f dist/index.html
            echo "web/dist 体积: $(du -sh dist | cut -f1)"

        - name: Rust 构建（Linux x86_64）
          script: |
            set -eu
            cargo build --release --locked
            ls -lh target/release/prompt-vault

        - name: 测试
          script: |
            set -eu
            # Qdrant Edge PoC 七步 / 量化档位 / 以图搜图回归，全部纯 CPU 且不需要模型
            cargo test --release --locked -- --test-threads=1

        - name: Windows 交叉编译
          script: |
            set -eu
            cargo build --release --locked --target x86_64-pc-windows-gnu
            ls -lh target/x86_64-pc-windows-gnu/release/prompt-vault.exe

        - name: 端到端冒烟
          script: |
            set -eu
            # 用 mock 编码器起服务（不加载任何模型），验证：
            #   ① 二进制能启动  ② /api/health 正常  ③ 首页是**真前端**而不是占位页
            ./target/release/prompt-vault --encoder mock --port 18918 --data-dir /tmp/pv-smoke &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18918/api/health > /tmp/health.json 2>/dev/null; then break; fi
              sleep 1
            done
            grep -q '"status"' /tmp/health.json
            curl -fsS http://127.0.0.1:18918/ | grep -q 'assets/'
            echo "✓ 服务可启动，health 正常，前端产物确实内嵌"
            jq -c '{status, encoder_mode: .encoder.mode, sparse: .index.sparse_enabled, quant: .index.quantization}' /tmp/health.json

        - name: 产物摘要
          script: |
            set -eu
            mkdir -p dist-artifacts
            cp target/release/prompt-vault dist-artifacts/
            cp target/x86_64-pc-windows-gnu/release/prompt-vault.exe dist-artifacts/
            cd dist-artifacts
            sha256sum prompt-vault prompt-vault.exe | tee SHA256SUMS
            ls -lh

        # 产物必须显式上传，否则流水线一结束就随容器消失了（只有日志里留个 sha256 没用）。
        # push 事件下 attachments 插件默认上传到「当前 commit 的附件」，可在提交详情页下载。
        - name: 上传产物（commit 附件）
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            attachments:
              - dist-artifacts/prompt-vault
              - dist-artifacts/prompt-vault.exe
              - dist-artifacts/SHA256SUMS

  # ------------------------------------------------------------ 手动触发（按钮）
  # 对应 .cnb/web_trigger.yml 里 `event: web_trigger_build` 的那个「手动编译」按钮。
  # 只做编译：前端 → Rust（按参数选平台）→ 可选测试 → 产物摘要。
  # 参数来自按钮弹窗（targets / run_tests），未传时走默认值。
  web_trigger_build:
    - name: 手动编译
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build:
          dockerfile: ci/Dockerfile
          by:
            - ci/Dockerfile
          versionBy:
            - ci/Dockerfile
        volumes:
          - /usr/local/cargo/registry
          - /usr/local/cargo/git
          - ./target
          - /root/.local/share/pnpm/store
      stages:
        - name: 环境自检
          script: |
            set -eu
            echo "工作目录: $(pwd)"
            node --version
            pnpm --version
            rustc --version
            echo "参数: targets=${targets:-both} run_tests=${run_tests:-true}"

        - name: 前端构建
          script: |
            set -eu
            cd web
            pnpm install --frozen-lockfile
            pnpm build
            test -f dist/index.html

        - name: 编译
          script: |
            set -eu
            T="${targets:-both}"
            case "$T" in
              both|linux)   cargo build --release --locked ;;
            esac
            case "$T" in
              both|windows) cargo build --release --locked --target x86_64-pc-windows-gnu ;;
            esac
            ls -lh target/release/prompt-vault 2>/dev/null || true
            ls -lh target/x86_64-pc-windows-gnu/release/prompt-vault.exe 2>/dev/null || true

        - name: 测试
          script: |
            set -eu
            if [ "${run_tests:-true}" = "true" ]; then
              cargo test --release --locked -- --test-threads=1
            else
              echo "已按参数跳过测试"
            fi

        - name: 产物摘要
          script: |
            set -eu
            mkdir -p dist-artifacts
            for f in target/release/prompt-vault target/x86_64-pc-windows-gnu/release/prompt-vault.exe; do
              if [ -f "$f" ]; then cp "$f" dist-artifacts/; fi
            done
            cd dist-artifacts
            sha256sum * | tee SHA256SUMS
            ls -lh

        # web_trigger_* 不在 attachments 插件的事件白名单里，所以显式指定 commit，
        # 让产物同样落在这个 commit 的附件上。
        - name: 上传产物（commit 附件）
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            commit: $CNB_COMMIT
            attachments:
              - dist-artifacts/prompt-vault
              - dist-artifacts/prompt-vault.exe
              - dist-artifacts/SHA256SUMS


# ---------------------------------------------------------------- 打 Tag 时发布
# 推一个 tag（如 v0.1.0）→ 构建双平台产物 → 创建 Release → 把两个二进制挂成附件。
# 附件插件要求「tag 需有对应的 release 才能上传附件」，所以创建 Release 必须在附件步骤之前。
$:
  tag_push:
    - name: 发布 Release
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build:
          dockerfile: ci/Dockerfile
          by:
            - ci/Dockerfile
          versionBy:
            - ci/Dockerfile
        volumes:
          - /usr/local/cargo/registry
          - /usr/local/cargo/git
          - ./target
          - /root/.local/share/pnpm/store
      stages:
        - name: 前端构建
          script: |
            set -eu
            cd web
            pnpm install --frozen-lockfile
            pnpm build
            test -f dist/index.html

        - name: 双平台构建
          script: |
            set -eu
            cargo build --release --locked
            cargo build --release --locked --target x86_64-pc-windows-gnu

        - name: 测试
          script: |
            set -eu
            cargo test --release --locked -- --test-threads=1

        - name: 组装产物
          script: |
            set -eu
            mkdir -p release-assets
            cp target/release/prompt-vault release-assets/prompt-vault-linux-x86_64
            cp target/x86_64-pc-windows-gnu/release/prompt-vault.exe release-assets/prompt-vault-windows-x86_64.exe
            cd release-assets
            sha256sum prompt-vault-linux-x86_64 prompt-vault-windows-x86_64.exe > SHA256SUMS
            cat SHA256SUMS
            ls -lh

        - name: 创建 Release
          type: git:release
          options:
            tag: $CNB_BRANCH
            overlying: true
            description: |
              prompt-vault $CNB_BRANCH

              产物（均不含模型权重，按开发文档 §10 铁律 8）：
              - prompt-vault-linux-x86_64
              - prompt-vault-windows-x86_64.exe

              运行：`./prompt-vault --encoder mock`（不跑模型的链路验证）
              或指向编码侧车：`--encoder-url http://127.0.0.1:8917`

        - name: 上传附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            attachments:
              - release-assets/prompt-vault-linux-x86_64
              - release-assets/prompt-vault-windows-x86_64.exe
              - release-assets/SHA256SUMS

# ---------------------------------------------------------------- CUDA 变体模板
#
# ⚠️ 现在是**注释状态**：本项目当前还没有引入 candle，编出来的也是不含 CUDA 的普通二进制，
#    所以不启用；等真的把编码层换成 candle 后端时，把下面这段接进 main.push 的数组即可
#    （多条 pipeline 会并发执行，互不影响）。
#
# ┌─ 关键认知：编译 CUDA 不需要 GPU ─────────────────────────────────────────┐
# │ 只要有 nvcc（来自 *-devel 镜像）就能编出 CUDA 产物，普通 CPU 节点即可。  │
# │ 需要显卡的只有两件事：① 在 CI 里跑 GPU 推理测试；② 运行产物。            │
# │ 所以这里**必须用 cnb:arch:amd64**，不要用 cnb:arch:amd64:gpu ——         │
# │ 后者是计费的 GPU 节点，对「只编译」是纯浪费。                            │
# │ 参考：candle 官方 CI 也把 nvcc 的来源解耦成容器镜像（它租 GPU 机器只是  │
# │ 为了跑测试，不是为了编译）。                                             │
# └──────────────────────────────────────────────────────────────────────────┘
#
# 另一条必须做的：显式设 CUDA_COMPUTE_CAP。不设的话 candle 的构建依赖
# （cudaforge / bindgen_cuda）会 fallback 去调 nvidia-smi 探测架构，在没有卡的
# 机器上直接 panic —— 这正是官方 issue「panic without nvidia-smi」。
