# prompt-vault 云原生构建（CNB）流水线
#
# ┌─ 读这份配置前先记住一条铁律 ─────────────────────────────────────────────┐
# │ 前端必须在 Rust 之前构建。                                               │
# │ 原因：前端产物是用 rust-embed 在**编译期**嵌进二进制的，顺序反了不会报错 │
# │ （build.rs 会写一个占位页兜底），只会静默产出一个「打开是占位页」的二进制。│
# │ 所以下面每个流水线的 stage 顺序都是「前端 → Rust → 测试 → 冒烟」。       │
# └──────────────────────────────────────────────────────────────────────────┘

# ---------------------------------------------------------------- 主分支 / PR
main:
  push:
    - name: 构建与测试（Linux + Windows 交叉编译）
      runner:
        # CNB 官方 amd64 节点；本项目不需要 GPU（不跑模型）
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        # 用 ci/Dockerfile 现建环境镜像（Node 22 + Rust 1.99 + mingw-w64）
        build:
          dockerfile: ci/Dockerfile
          by:
            - ci/Dockerfile
          versionBy:
            - ci/Dockerfile
        # 缓存：cargo 依赖与编译产物、pnpm store。均走默认的 copy-on-write，可并发构建。
        # 注意：卷路径之间不能有包含关系，所以 registry 与 git 分开声明。
        # 另外 volumes 是 docker 的子字段（不是 pipeline 级字段），放错层级 schema 会直接拒绝。
        volumes:
          - /usr/local/cargo/registry
          - /usr/local/cargo/git
          - ./target
          - /root/.local/share/pnpm/store
      stages:
        - name: 环境自检
          script: |
            set -eu
            echo "工作目录: $(pwd)"
            node --version
            pnpm --version
            rustc --version
            cargo --version
            x86_64-w64-mingw32-gcc --version | head -1

        - name: 前端构建
          script: |
            set -eu
            cd web
            pnpm install --frozen-lockfile
            pnpm build
            test -f dist/index.html
            echo "web/dist 体积: $(du -sh dist | cut -f1)"

        - name: Rust 构建（Linux x86_64）
          script: |
            set -eu
            cargo build --release --locked
            ls -lh target/release/prompt-vault

        - name: 测试
          script: |
            set -eu
            # Qdrant Edge PoC 七步 / 量化档位 / 以图搜图回归，全部纯 CPU 且不需要模型
            cargo test --release --locked -- --test-threads=1

        - name: Windows 交叉编译
          script: |
            set -eu
            cargo build --release --locked --target x86_64-pc-windows-gnu
            ls -lh target/x86_64-pc-windows-gnu/release/prompt-vault.exe

        - name: 端到端冒烟
          script: |
            set -eu
            # 用 mock 编码器起服务（不加载任何模型），验证：
            #   ① 二进制能启动  ② /api/health 正常  ③ 首页是**真前端**而不是占位页
            ./target/release/prompt-vault --encoder mock --port 18918 --data-dir /tmp/pv-smoke &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18918/api/health > /tmp/health.json 2>/dev/null; then break; fi
              sleep 1
            done
            grep -q '"status"' /tmp/health.json
            curl -fsS http://127.0.0.1:18918/ | grep -q 'assets/'
            echo "✓ 服务可启动，health 正常，前端产物确实内嵌"
            jq -c '{status, encoder_mode: .encoder.mode, sparse: .index.sparse_enabled, quant: .index.quantization}' /tmp/health.json

        - name: 产物摘要
          script: |
            set -eu
            mkdir -p dist-artifacts
            cp target/release/prompt-vault dist-artifacts/
            cp target/x86_64-pc-windows-gnu/release/prompt-vault.exe dist-artifacts/
            cd dist-artifacts
            sha256sum prompt-vault prompt-vault.exe | tee SHA256SUMS
            ls -lh

        # 上传前先自检：把「文件在不在、cwd 是哪个、目标 commit 是哪个」打进日志。
        # 没有这段，上传后附件为空时无法区分「产物没生成」（前面阶段红了）
        # 和「路径/事件不对」（产物在、但插件没传上去）。
        - name: 上传前自检
          script: |
            set -eu
            echo "pwd=$(pwd)"
            echo "CNB_BUILD_WORKSPACE=${CNB_BUILD_WORKSPACE:-<未设置>}"
            echo "CNB_COMMIT=${CNB_COMMIT:-<未设置>}  CNB_BRANCH=${CNB_BRANCH:-<未设置>}"
            echo "--- 工作目录 ---"
            ls -la
            echo "--- dist-artifacts ---"
            ls -la dist-artifacts
            echo "--- 全仓可上传的产物 ---"
            find . -maxdepth 4 -type f \( -name 'prompt-vault' -o -name 'prompt-vault.exe' -o -name 'SHA256SUMS' \) -exec ls -lh {} \;

        # 产物必须显式上传，否则流水线一结束就随容器消失了（只有日志里留个 sha256 没用）。
        # push 事件下不传 commit/tag 时，插件默认上传到 $CNB_COMMIT 的 commit 附件（提交详情页可见）。
        # 写法对齐官方示例：路径带 ./、不写 type（默认即 UPLOAD）、用 exports 把上传清单回读到日志。
        - name: 上传产物（commit 附件）
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist-artifacts/prompt-vault"
              - "./dist-artifacts/prompt-vault.exe"
              - "./dist-artifacts/SHA256SUMS"
          exports:
            FILES: FILES

        - name: 确认上传结果
          script: |
            echo "插件回传的上传文件清单: ${FILES:-<空——插件没有报出任何已上传文件>}"

      # 无论 stages 成败都执行（官方语义：endStages 失败也不影响流水线状态），
      # 用于「构建红了」时也能在日志末尾看到现场，而不是只看到一句附件是空的。
      endStages:
        - name: 附件自检（无论成败）
          script: |
            set +e
            echo "=== 现场 ==="
            echo "pwd=$(pwd)"
            echo "CNB_BUILD_WORKSPACE=${CNB_BUILD_WORKSPACE:-<未设置>}"
            echo "CNB_COMMIT=${CNB_COMMIT:-<未设置>}"
            echo "FILES=${FILES:-<空>}"
            echo "=== dist-artifacts ==="
            ls -la dist-artifacts 2>&1

  # ------------------------------------------------------------ 手动同步到 GitHub
  # 对应 .cnb/web_trigger.yml 里 `event: web_trigger_sync_github` 的「同步到 GitHub」按钮。
  # 用 git-sync 插件的 **rebase 模式**：先 fetch + rebase 再推，不会覆盖 GitHub 上别人的提交。
  #
  # ⚠️ 需要你替换两处（不改就是死的）：
  #   1. imports 指向你自己的 CNB 密钥仓库文件，里面至少要有：
  #        GIT_USERNAME: <你的 GitHub 用户名>
  #        GIT_EMAIL: <你的 GitHub 邮箱>
  #        GITHUB_TOKEN: <有 repo 权限的 PAT>
  #   2. settings.target_url 改成你的 GitHub 仓库地址
  #
  # 关于「屏蔽无用文件」：git-sync 同步的是 **git 对象**，不是工作区，
  # 所以 .gitignore 里的东西（模型 4.2GB / data / target / node_modules / web/dist / download）
  # 天然不会被带过去 —— 前提是它们从来没被提交过。当前仓库满足这个前提。
  web_trigger_sync_github:
    - name: 同步到 GitHub（rebase）
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      imports:
        # 密钥仓库文件（私有），内容见 ~/.ssh/github.yml：
        #   GITHUB_SSH_KEY: |  ← 缩进 2 格的完整 ed25519 私钥
        - https://cnb.cool/yaorz/secret/-/blob/main/github.yml
      stages:
        - name: 同步到 GitHub
          image: tencentcom/git-sync
          settings:
            # SSH 方式：地址必须是 git@host:owner/repo.git 形式
            target_url: git@github.com:Ya-RZ/prompt-vault.git
            auth_type: ssh
            # SSH 私钥内容（不是路径）；由密钥仓库的 GITHUB_SSH_KEY 注入
            ssh_key: ${GITHUB_SSH_KEY}
            # 同步时的提交身份（rebase 可能产生新提交，别让它落成 plugin 默认值）
            git_user: Ya-RZ
            git_email: sprders@outlook.com
            branch: main
            # rebase：先 fetch + rebase 再推，保留 GitHub 侧的手动提交；
            # 注意该模式下插件的 force 默认变为 true
            sync_mode: rebase
            # 顺手把 tag 也推过去，GitHub 上才能按 tag 触发 Release
            push_tags: true


  # ------------------------------------------------------------ 手动触发（按钮）
  # 对应 .cnb/web_trigger.yml 里 `event: web_trigger_build` 的那个「手动编译」按钮。
  # 只做编译：前端 → Rust（按参数选平台）→ 可选测试 → 产物摘要。
  # 参数来自按钮弹窗（targets / run_tests），未传时走默认值。
  web_trigger_build:
    - name: 手动编译
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build:
          dockerfile: ci/Dockerfile
          by:
            - ci/Dockerfile
          versionBy:
            - ci/Dockerfile
        volumes:
          - /usr/local/cargo/registry
          - /usr/local/cargo/git
          - ./target
          - /root/.local/share/pnpm/store
      stages:
        - name: 环境自检
          script: |
            set -eu
            echo "工作目录: $(pwd)"
            node --version
            pnpm --version
            rustc --version
            echo "参数: targets=${targets:-both} run_tests=${run_tests:-true}"

        - name: 前端构建
          script: |
            set -eu
            cd web
            pnpm install --frozen-lockfile
            pnpm build
            test -f dist/index.html

        - name: 编译
          script: |
            set -eu
            T="${targets:-both}"
            case "$T" in
              both|linux)   cargo build --release --locked ;;
            esac
            case "$T" in
              both|windows) cargo build --release --locked --target x86_64-pc-windows-gnu ;;
            esac
            ls -lh target/release/prompt-vault 2>/dev/null || true
            ls -lh target/x86_64-pc-windows-gnu/release/prompt-vault.exe 2>/dev/null || true

        - name: 测试
          script: |
            set -eu
            if [ "${run_tests:-true}" = "true" ]; then
              cargo test --release --locked -- --test-threads=1
            else
              echo "已按参数跳过测试"
            fi

        - name: 产物摘要
          script: |
            set -eu
            mkdir -p dist-artifacts
            for f in target/release/prompt-vault target/x86_64-pc-windows-gnu/release/prompt-vault.exe; do
              if [ -f "$f" ]; then cp "$f" dist-artifacts/; fi
            done
            cd dist-artifacts
            if [ "$(ls -A .)" = "" ]; then
              echo "dist-artifacts 为空：本次没有编出任何二进制（检查上面的编译参数）"
              exit 1
            fi
            sha256sum * | tee SHA256SUMS
            ls -lh

        # 自检：确认产物就位、并打印本次要落附件的 commit / 事件，便于判断 web_trigger 下
        # $CNB_COMMIT 到底有没有值（这是「手动编译拿不到附件」最可疑的一环）。
        - name: 上传前自检
          script: |
            set -eu
            echo "pwd=$(pwd)"
            echo "CNB_BUILD_WORKSPACE=${CNB_BUILD_WORKSPACE:-<未设置>}"
            echo "CNB_COMMIT=${CNB_COMMIT:-<未设置>}"
            echo "CNB_EVENT=${CNB_EVENT:-<未设置>}"
            echo "本仓库当前 HEAD=$(git rev-parse HEAD 2>/dev/null || echo '<未知>')"
            echo "--- dist-artifacts ---"
            ls -la dist-artifacts
            echo "--- 全仓可上传的产物 ---"
            find . -maxdepth 4 -type f \( -name 'prompt-vault' -o -name 'prompt-vault.exe' -o -name 'SHA256SUMS' \) -exec ls -lh {} \;

        # 官方附件插件支持的事件白名单不含 web_trigger_*（见 docs.cnb.cool 附件插件页），
        # 所以这里显式指定 commit，试图把产物落到该 commit 的附件上；若日志显示这一步被拒，
        # 说明这条路径不被支持，应改走 tag_push → Release 附件（见文件末尾说明）。
        - name: 上传产物（commit 附件）
          image: cnbcool/attachments:latest
          settings:
            commit: $CNB_COMMIT
            attachments:
              - "./dist-artifacts/prompt-vault"
              - "./dist-artifacts/prompt-vault.exe"
              - "./dist-artifacts/SHA256SUMS"
          exports:
            FILES: FILES

        - name: 确认上传结果
          script: |
            echo "插件回传的上传文件清单: ${FILES:-<空——插件没有报出任何已上传文件>}"

      endStages:
        - name: 附件自检（无论成败）
          script: |
            set +e
            echo "=== 现场 ==="
            echo "pwd=$(pwd)"
            echo "CNB_COMMIT=${CNB_COMMIT:-<未设置>}"
            echo "CNB_EVENT=${CNB_EVENT:-<未设置>}"
            echo "FILES=${FILES:-<空>}"
            echo "=== dist-artifacts ==="
            ls -la dist-artifacts 2>&1


# ---------------------------------------------------------------- 打 Tag 时发布
# 推一个 tag（如 v0.1.0）→ 构建双平台产物 → 创建 Release → 把两个二进制挂成附件。
# 附件插件要求「tag 需有对应的 release 才能上传附件」，所以创建 Release 必须在附件步骤之前。
$:
  tag_push:
    - name: 发布 Release
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        build:
          dockerfile: ci/Dockerfile
          by:
            - ci/Dockerfile
          versionBy:
            - ci/Dockerfile
        volumes:
          - /usr/local/cargo/registry
          - /usr/local/cargo/git
          - ./target
          - /root/.local/share/pnpm/store
      stages:
        - name: 前端构建
          script: |
            set -eu
            cd web
            pnpm install --frozen-lockfile
            pnpm build
            test -f dist/index.html

        - name: 双平台构建
          script: |
            set -eu
            cargo build --release --locked
            cargo build --release --locked --target x86_64-pc-windows-gnu

        - name: 测试
          script: |
            set -eu
            cargo test --release --locked -- --test-threads=1

        - name: 组装产物
          script: |
            set -eu
            mkdir -p release-assets
            cp target/release/prompt-vault release-assets/prompt-vault-linux-x86_64
            cp target/x86_64-pc-windows-gnu/release/prompt-vault.exe release-assets/prompt-vault-windows-x86_64.exe
            cd release-assets
            sha256sum prompt-vault-linux-x86_64 prompt-vault-windows-x86_64.exe > SHA256SUMS
            cat SHA256SUMS
            ls -lh

        - name: 创建 Release
          type: git:release
          options:
            tag: $CNB_BRANCH
            overlying: true
            description: |
              prompt-vault $CNB_BRANCH

              产物（均不含模型权重，按开发文档 §10 铁律 8）：
              - prompt-vault-linux-x86_64
              - prompt-vault-windows-x86_64.exe

              运行：`./prompt-vault --encoder mock`（不跑模型的链路验证）
              或指向编码侧车：`--encoder-url http://127.0.0.1:8917`

        - name: 上传附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            attachments:
              - release-assets/prompt-vault-linux-x86_64
              - release-assets/prompt-vault-windows-x86_64.exe
              - release-assets/SHA256SUMS

# ---------------------------------------------------------------- CUDA 变体模板
#
# ⚠️ 现在是**注释状态**：candle 已经接进来了（--encoder candle），但默认构建**不开** cuda feature，
#    所以下面的 job 现在编出来仍是纯 CPU 版。要出 CUDA 版时把这段接进 main.push 的数组即可
#    （多条 pipeline 会并发执行，互不影响）；注意 candle 的 cuda 需要 `--features cuda`，
#    并且 fastembed 的 candle 后端要打开对应 feature。
#
# ┌─ 关键认知：编译 CUDA 不需要 GPU ─────────────────────────────────────────┐
# │ 只要有 nvcc（来自 *-devel 镜像）就能编出 CUDA 产物，普通 CPU 节点即可。  │
# │ 需要显卡的只有两件事：① 在 CI 里跑 GPU 推理测试；② 运行产物。            │
# │ 所以这里**必须用 cnb:arch:amd64**，不要用 cnb:arch:amd64:gpu ——         │
# │ 后者是计费的 GPU 节点，对「只编译」是纯浪费。                            │
# │ 参考：candle 官方 CI 也把 nvcc 的来源解耦成容器镜像（它租 GPU 机器只是  │
# │ 为了跑测试，不是为了编译）。                                             │
# └──────────────────────────────────────────────────────────────────────────┘
#
# 另一条必须做的：显式设 CUDA_COMPUTE_CAP。不设的话 candle 的构建依赖
# （cudaforge / bindgen_cuda）会 fallback 去调 nvidia-smi 探测架构，在没有卡的
# 机器上直接 panic —— 这正是官方 issue「panic without nvidia-smi」。
