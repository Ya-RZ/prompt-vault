# Windows + CUDA 构建（GitHub Actions）
#
# 为什么需要这个 workflow：从 Linux 交叉编译 Windows CUDA 是做不到的
# —— nvcc 在 Windows 上必须用 MSVC 作为 host compiler，而 MSVC 跑不了 Linux。
# 所以 Windows 的 CUDA 版只能在 Windows 上原生编译。
#
# 成本（2026 数据）：本仓库是 public 时，GitHub 标准的 windows-latest runner **免费且不扣分钟**；
# 私有仓库则按 Windows 的 ×2 倍率消耗免费额度（Free 计划 2000 分钟/月 ≈ 1000 分钟 Windows）。
# GPU runner（larger runner）不在免费范围，但本 workflow **不需要 GPU** ——
# 编译 CUDA 只要有 nvcc，跑才需要卡。
#
# 两个已知坑（都是官方 issue）：
#   1. candle/kernels 与过新的 nvcc 有兼容问题（huggingface/candle#3737，
#      RTX 20xx + nvcc 12.9 编译失败）→ 这里钉 CUDA 12.4，别盲目用最新。
#   2. bindgen_cuda 不查 PATH（huggingface/candle#3166）→ 显式依赖 cuda-toolkit action
#      设置的 CUDA_PATH，并在下面回显一次以便排错。

name: windows-cuda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web/**"
      - "build.rs"
      - ".github/workflows/windows-cuda.yml"

concurrency:
  group: windows-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 不用 windows-latest：它现在的 Visual Studio 版本已经超出 CUDA 12.4 的
    # host_config.h 白名单（只支持 VS 2017–2022），会直接报
    #   #error: -- unsupported Microsoft Visual Studio version!
    # windows-2022 带的是 VS 2022(17.x)，在支持范围内。
    runs-on: windows-2022
    env:
      # 目标卡的算力：RTX 4060 是 Ada = sm_89；30 系 Ampere 用 86；20 系 Turing 用 75。
      # 不设的话 candle 的构建脚本会 fallback 去调 nvidia-smi，在无卡 runner 上直接 panic。
      CUDA_COMPUTE_CAP: "89"
      CARGO_TERM_COLOR: always
      # 打印完整错误，方便定位 candle 编译问题
      RUST_BACKTRACE: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust（MSVC 工具链）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          # cuda feature 会编译 candle 的 kernel，缓存命中率直接影响耗时
          shared-key: windows-cuda
          # 默认 false：失败的 run 不保存缓存，于是每次调错都要从零编译 20+ 分钟
          cache-on-failure: true

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 pnpm（与 lockfile 对齐）
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
          pnpm --version

      - name: 配置 MSVC 开发环境（cl.exe）
        # nvcc 在 Windows 上把 MSVC 的 cl.exe 当 host compiler。
        # windows-latest 装了 Visual Studio，但 cl.exe 默认**不在 PATH**里，
        # 不做这一步会报：nvcc fatal : Cannot find compiler 'cl.exe' in PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 CUDA Toolkit
        id: cuda
        # v0.2.20 的版本清单里最高只到 12.x，请求 13.2.0 会直接报
        #   Error: Version not available: 13.2.0
        # v0.2.36 才包含 13.2.0。
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          # 钉 12.4：更新的 nvcc 与 candle-kernels 0.11 有兼容报告
          # 回滚基线：tag v0.1.0-cuda12.4（CUDA 12.4 + windows-2022，已验证全绿）
          # 实验：CUDA 13.2（candle 官方 CI 用 13.0.2/13.2.1；cudarc 已支持 13.x）
          # 动机：12.4 最高只到 sm_90，不支持 Blackwell（RTX 50 系 sm_120）
          cuda: "13.2.0"
          method: network
          # 刻意**不限制 sub-packages**（装完整 toolkit）。
          # 之前只装了 nvcc/cudart/cublas/curand/thrust，结果链接时缺 nvrtc.lib：
          #   LINK : fatal error LNK1181: cannot open input file 'nvrtc.lib'
          # candle 的 CUDA 后端需要 nvrtc（运行时编译 kernel）。与其逐个猜包名，
          # 不如整包装上；代价是多下几 GB，换来一次跑通。

      - name: 回显 CUDA 环境
        run: |
          echo "CUDA_PATH=$env:CUDA_PATH"
          nvcc --version
          echo "CUDA_COMPUTE_CAP=$env:CUDA_COMPUTE_CAP"

      - name: 前端构建（必须早于 cargo build）
        # rust-embed 在编译期把 web/dist 打进二进制；顺序反了会静默产出占位页
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          if (-Not (Test-Path "dist/index.html")) { throw "web/dist/index.html 不存在" }

      - name: 构建（CUDA）
        run: |
          # 把完整输出留一份到文件并回显，避免 Actions 折叠吞掉关键行
          cargo build --release --locked --features cuda 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "### cargo build 失败" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content build.log -Tail 120 | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: 校验产物（不运行）
        # 不在 CI 里运行：CUDA 版 exe 的 import 表里有 nvcuda.dll（NVIDIA 驱动提供），
        # runner 无显卡，启动必然 0xC0000135。这是物理限制，不是缺陷。
        # 校验只做与「链接方式」无关的检查 —— CUDA 12.4 时 nvcuda.dll 静态出现在
        # import 表，CUDA 13.2 下 cudarc 改成动态加载就没了，写死具体 DLL 会误报。
        run: |
          $exe = ".\target\release\prompt-vault.exe"
          if (-Not (Test-Path $exe)) { throw "产物不存在" }

          $size = (Get-Item $exe).Length
          $sizeMB = [math]::Round($size / 1MB, 1)
          Write-Output "产物大小: $sizeMB MB"
          # CPU 版约 38MB；CUDA 版（无论 12.4/13.2）实测都 ~54MB
          if ($size -lt 40MB) { throw "产物偏小（$sizeMB MB），疑似 CUDA 未真正启用" }

          $headers = (dumpbin /HEADERS $exe 2>$null) -join "`n"
          if ($headers -notmatch "machine \(x64\)") { throw "产物不是 x64 PE" }
          if ($headers -notmatch "PE32\+") { throw "产物不是 64 位 PE" }
          Write-Output "✓ PE32+ x64，体积符合 CUDA 版特征"

          # import 表仅供记录（不做硬性断言，避免因链接方式变化误报）
          Write-Output "=== import 表（仅记录） ==="
          dumpbin /DEPENDENTS $exe 2>$null | Select-String "\.dll" | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique

      - name: 收集产物
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\prompt-vault.exe dist\prompt-vault-windows-x86_64-cuda.exe
          (Get-FileHash dist\prompt-vault-windows-x86_64-cuda.exe -Algorithm SHA256).Hash |
            Out-File -Encoding ascii dist\SHA256SUMS
          Get-Content dist\SHA256SUMS
          Get-Item dist\prompt-vault-windows-x86_64-cuda.exe | Select-Object Name, Length

      - name: 打包免安装版（exe + CUDA runtime DLL）
        # nvcuda.dll 不打包：它是显卡驱动的一部分，随驱动安装，不能分发。
        # 其余 CUDA runtime DLL 按通配符整包带上，避免因版本号变化漏文件。
        run: |
          $dist = "dist/portable"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target\release\prompt-vault.exe $dist\

          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          Write-Output "=== CUDA\bin 中 cublas/cudart/curand/nvrtc 相关 DLL ==="
          $candidates = Get-ChildItem $cudaBin -Filter *.dll |
            Where-Object { $_.Name -match '^(cublas|cublasLt|cudart|curand|nvrtc)' } |
            Sort-Object Name
          $candidates | ForEach-Object { Write-Output ("  {0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }
          $candidates | ForEach-Object { Copy-Item $_.FullName $dist\ }

          # MSVC 运行时（目标机没装 VC++ Redist 时需要）
          $vcRun = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($v in $vcRun) {
            $hit = Get-ChildItem "C:\Windows\System32" -Filter $v -ErrorAction SilentlyContinue
            if ($hit) { Copy-Item $hit.FullName $dist\ }
          }

          # 说明文件
          @"
          prompt-vault (Windows x86_64, CUDA)

          直接运行：prompt-vault.exe
          前置条件：机器需要安装 NVIDIA 显卡驱动（提供 nvcuda.dll），无需安装 CUDA Toolkit。

          本目录已内含 CUDA runtime：cublas / cudart / curand / nvrtc。
          编码模型需要单独准备，用 --model-dir 指向 Qwen3-VL-Embedding-2B 目录：
            prompt-vault.exe --encoder candle --model-dir <模型目录>
          "@ | Out-File -Encoding utf8 $dist\README.txt

          $totalMB = [math]::Round(((Get-ChildItem $dist -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Output "=== portable 总大小: $totalMB MB ==="
          Get-ChildItem $dist -File | Sort-Object Length -Descending | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

          Compress-Archive -Path "$dist\*" -DestinationPath "dist/prompt-vault-windows-cuda-portable.zip" -CompressionLevel Optimal -Force
          $zipMB = [math]::Round(((Get-Item "dist/prompt-vault-windows-cuda-portable.zip").Length / 1MB), 1)
          Write-Output "=== zip 大小: $zipMB MB ==="
          (Get-FileHash "dist/prompt-vault-windows-cuda-portable.zip" -Algorithm SHA256).Hash |
            Out-File -Encoding ascii "dist/portable-SHA256SUMS"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: prompt-vault-windows-x86_64-cuda
          path: |
            dist/prompt-vault-windows-x86_64-cuda.exe
            dist/SHA256SUMS
            dist/prompt-vault-windows-cuda-portable.zip
            dist/portable-SHA256SUMS
          if-no-files-found: error
