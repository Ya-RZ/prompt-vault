[package]
name = "prompt-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "本地提示词 / 图片资产库：Salvo 主服务 + Qdrant Edge 混合检索 + Ant Design v6 前端"

[dependencies]
# --- HTTP 层（开发文档 §0：Salvo 1.0.1）---
# 刻意不用 `full`：它会拖进 openssl / native-tls / aws-lc-rs，
# 既用不上（服务只监听 127.0.0.1 走明文 HTTP），又会让 Windows 交叉编译直接卡死
# （openssl-sys 找不到目标平台的 OpenSSL）。这里只留真正用到的 feature。
salvo = { version = "1.0.1", default-features = false, features = [
    "server", "http1", "http2", "affix-state", "serve-static",
    "fix-http1-request-uri", "matched-path",
] }
tokio = { version = "1", features = ["full"] }

# --- 元数据（开发文档 §8：rusqlite bundled）---
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }

# --- 向量存储 + 检索（开发文档 §6：qdrant-edge 0.8.0，唯一索引）---
qdrant-edge = "0.8.0"

# --- 序列化 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- 进程内编码（candle 后端；HTTP 侧车已移除，只加载本地模型）---
# qwen3: candle 实现的 Qwen3-VL 多模态编码；hf-hub: 用它提供的缓存目录解析（离线可控）
# ort-load-dynamic: fastembed 会无条件引入 `ort`(ONNX Runtime)，即使我们只用 candle 后端。
#   不加这个 feature 时，链接期会要求 onnxruntime 的符号，Windows 上直接
#   LNK2019: unresolved external symbol OrtGetApiBase / LNK1120。
#   动态加载后只有真正调用 ONNX 路径时才需要 onnxruntime.dll —— 我们从不调用。
fastembed = { version = "7.1.1", default-features = false, features = ["qwen3", "hf-hub", "ort-load-dynamic"] }
# fastembed 的 Qwen3VLEmbedding 接口签名里出现 candle 的 Device/DType，需要同版本直接依赖
candle-core = "0.11"
# 仅 cuda feature 下使用：启动时枚举 NVIDIA 设备（名称 / 算力 / 显存），
# 供 --candle-device auto 挑一张最合适的卡。candle 没有暴露设备枚举接口，只能直接调驱动。
# 版本必须与 candle-core 0.11 依赖的 cudarc 一致，否则会同时链两份 driver。
cudarc = { version = "0.19.8", default-features = false, optional = true, features = ["std", "driver", "dynamic-linking"] }

# --- 资产处理 ---
image = "0.25"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
base64 = "0.23"

# --- 工具 ---
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# --- 前端产物打包进二进制（开发文档 §0：构建产物由 Rust 侧 embed）---
rust-embed = { version = "8", features = ["include-exclude"] }

[features]
# 进程内编码的 GPU 加速。默认**关闭**：本机与 CNB 的普通节点都没有 CUDA Toolkit，
# 只有 GitHub Actions 的 Windows CUDA job 才会带 --features cuda 构建。
# 打开后 candle 会编译 CUDA kernel，需要 nvcc + CUDA_COMPUTE_CAP（见 .github/workflows/windows-cuda.yml）。
cuda = ["fastembed/cuda", "candle-core/cuda", "dep:cudarc"]
# cuDNN 加速（可选；candle issue #3737 提示新 nvcc 版本可能编译失败，按需再开）
cudnn = ["fastembed/cudnn", "candle-core/cudnn", "cuda"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
