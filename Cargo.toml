[package]
name = "prompt-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "本地提示词 / 图片资产库：Salvo 主服务 + Qdrant Edge 混合检索 + Ant Design v6 前端"

[dependencies]
# --- HTTP 层（开发文档 §0：Salvo 1.0.1）---
# 刻意不用 `full`：它会拖进 openssl / native-tls / aws-lc-rs，
# 既用不上（服务只监听 127.0.0.1 走明文 HTTP），又会让 Windows 交叉编译直接卡死
# （openssl-sys 找不到目标平台的 OpenSSL）。这里只留真正用到的 feature。
salvo = { version = "1.0.1", default-features = false, features = [
    "server", "http1", "http2", "affix-state", "serve-static",
    "fix-http1-request-uri", "matched-path",
] }
tokio = { version = "1", features = ["full"] }

# --- 元数据（开发文档 §8：rusqlite bundled）---
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }

# --- 向量存储 + 检索（Qdrant Server，gRPC 客户端）---
# 2026-10-18：由 qdrant-edge（嵌入式 shard）切换为 Qdrant Server。
# 服务地址通过 --qdrant-url / PV_QDRANT_URL 配置，集合名通过 --qdrant-collection 配置。
qdrant-client = { version = "1.19", default-features = false, features = ["serde"] }

# --- 序列化 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- 编码：第三方 embedding API（OpenAI 兼容 /v1/embeddings）---
# 2026-11：删除进程内 candle 模型加载（4 GB 权重 + 显存），改为调用云端服务。
# 刻意用 rustls 而不是 native-tls：项目不依赖 openssl，否则 Windows 交叉编译会卡。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- 资产处理 ---
image = "0.25"
# PNG zTXt/iTXt 解压（ComfyUI 元数据里可能是压缩文本块）
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# 资产指纹统一用 blake3（迁移 0002 起；sha2 仍被 encode / 缩略图缓存用着，别删）
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
base64 = "0.23"

# --- 工具 ---
clap = { version = "4", features = ["derive", "env"] }
# 配置文件（config.toml）：只解析，不引入复杂配置框架
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"

# --- 前端产物打包进二进制（开发文档 §0：构建产物由 Rust 侧 embed）---
rust-embed = { version = "8", features = ["include-exclude"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
